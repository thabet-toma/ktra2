name: CI

on:
  push:
    # newktra هو فرع العمل المعتمد (docs/REFACTOR_PROMPTS.md) — كانت CI على main
    # وحده وmain متوقف منذ 2026-07-19، فلا شيء كان يفحص العمل الفعلي آلياً.
    # (أُزيل claude/task6 و claude/task7 — فرعان تاريخيان متوقفان.)
    branches: [main, newktra]
  pull_request:
    branches: [main, newktra]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Tests run against SQLite in-memory via core.test_settings (see pytest.ini),
    # so no MySQL service is required.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import contracts (import-linter)
        # حاجز الاعتماديات بين الـapps — العقود والـbaseline في .importlinter
        # يمنع تشابكاً *جديداً* فقط؛ الانتهاكات القائمة موثّقة في docs/DEPENDENCIES.md
        run: lint-imports

      - name: Run pytest
        run: coverage run -m pytest
        env:
          DJANGO_SETTINGS_MODULE: core.test_settings

      - name: Coverage report
        run: coverage report

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_v2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend_v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        # ESLint 9/10 flat config: directories are matched via the config's
        # `files` globs (the legacy `--ext` flag was removed in ESLint 9).
        run: npx eslint components services hooks

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Playwright tests
        # Advisory: the offline e2e suite exercises sync flows that need a live
        # Django backend, which this isolated frontend job does not provision.
        # Keep it reporting without gating the pipeline.
        continue-on-error: true
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend_v2/playwright-report/
          retention-days: 7

  pwa-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_v2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend_v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun --upload.target=temporary-public-storage || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
