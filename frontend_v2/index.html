<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    
    <!-- ===== FAVICON الجديد - كامل ===== -->
    <!-- للمتصفحات العادية -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    
    <!-- لأجهزة Apple (iPhone, iPad) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <!-- للموقع التقدمي (PWA) -->
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- لون التبويب في Safari -->
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    
    <!-- ألوان Meta -->
    <meta name="msapplication-TileColor" content="#1e40af">
    <meta name="theme-color" content="#ffffff">
    <!-- ===== نهاية FAVICON ===== -->
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== SEO: عنوان ووصف وكلمات مفتاحية تظهر في نتائج بحث جوجل ===== -->
    <title>K.T.R.A — نظام متكامل لإدارة الاستيراد والمبيعات والمخزون والمحاسبة</title>
    <meta
      name="description"
      content="K.T.R.A نظام إدارة أعمال عربي متكامل: فواتير المبيعات والمشتريات، المخزون والمستودعات، الاستيراد والشحن والتخليص الجمركي، والمحاسبة المترابطة — في منصة واحدة."
    />
    <meta
      name="keywords"
      content="K.T.R.A, كترا, نظام إدارة أعمال, برنامج محاسبة عربي, نظام فواتير, إدارة المخزون, برنامج مبيعات ومشتريات, إدارة الاستيراد, الشحن والتخليص الجمركي, نظام ERP عربي"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ktra-pro.tech/" />

    <!-- Open Graph (معاينة الروابط في فيسبوك/واتساب/لينكدإن) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="K.T.R.A" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:url" content="https://ktra-pro.tech/" />
    <meta property="og:title" content="K.T.R.A — نظام متكامل لإدارة الاستيراد والمبيعات والمخزون والمحاسبة" />
    <meta
      property="og:description"
      content="اربط الاستيراد والمبيعات والمخزون والمحاسبة في دورة عمل واحدة — منصة عربية متكاملة لإدارة شركتك التجارية."
    />
    <meta property="og:image" content="https://ktra-pro.tech/android-chrome-512x512.png" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="K.T.R.A — نظام متكامل لإدارة الاستيراد والمبيعات والمخزون والمحاسبة" />
    <meta
      name="twitter:description"
      content="اربط الاستيراد والمبيعات والمخزون والمحاسبة في دورة عمل واحدة — منصة عربية متكاملة لإدارة شركتك التجارية."
    />
    <meta name="twitter:image" content="https://ktra-pro.tech/android-chrome-512x512.png" />

    <!-- بيانات مهيكلة (Schema.org) — تساعد جوجل على فهم طبيعة الموقع -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "K.T.R.A",
        "url": "https://ktra-pro.tech/",
        "description": "نظام إدارة أعمال عربي متكامل: فواتير المبيعات والمشتريات، المخزون، الاستيراد والشحن والتخليص الجمركي، والمحاسبة.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": "ar"
      }
    </script>
    <!-- ===== نهاية SEO ===== -->

    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0"
      }
    }
    </script>
    
    <!-- Dark Mode Script -->
    <script>
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
        document.documentElement.lang = 'ar'
        document.documentElement.dir = 'rtl'
      } else {
        document.documentElement.classList.remove('dark')
        document.documentElement.lang = 'ar'
        document.documentElement.dir = 'rtl'
      }
    </script>
    
  </head>
  <body class="bg-[#F0F4FF] dark:bg-gray-900 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
