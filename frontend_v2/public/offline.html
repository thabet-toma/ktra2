<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e40af" />
  <title>بدون اتصال — K.T.R.A</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #F0F4FF;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; color: #1e40af; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.7; color: #475569; margin-bottom: 8px; }
    .hint { font-size: 13px; color: #94a3b8; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>أنت بدون اتصال</h1>
    <p>يمكنك تصفّح آخر البيانات التي شاهدتها.</p>
    <p>الأعمال المحفوظة محلياً ستُرسل تلقائياً عند عودة الاتصال.</p>
    <p class="hint">حاول الاتصال بالشبكة وأعد التحميل</p>
  </div>
</body>
</html>
