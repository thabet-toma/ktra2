[pytest]
DJANGO_SETTINGS_MODULE = core.test_settings
python_files = test_*.py
# كل مجلد `<app>/tests` — القائمة صريحة لتستثني `venv/` و`.claude/worktrees/`.
# accountant_portal و after_sales و device_registry كانت ناقصة: 176 اختباراً
# (15% من المجموعة) لم يكن pytest يجمعها أصلاً، و**CI يشغّل pytest** ⇒ وحدة
# المحاسب القانوني وما بعد البيع وسجل الأجهزة كانت بلا تغطية في CI رغم وجود
# اختباراتها. أي app جديدة بمجلد اختبارات تُضاف هنا، ويحرس ذلك
# `core/tests/test_docs_freshness.py`.
testpaths = accountant_portal/tests accounting/tests after_sales/tests bridge/tests core/tests device_registry/tests docshare/tests hr/tests import_file/tests inventory/tests logistics/tests partners/tests sales/tests store/tests tenants/tests
addopts = --nomigrations
